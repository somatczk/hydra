version: 2

# Minor and patch bumps are grouped per ecosystem and auto-merge on green CI
# (dependabot-auto-merge.yml). Majors and base images open one PR each for review.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # new releases wait a few days so a hijacked one can be pulled first
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dashboard:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /docker/engine
      - /docker/dashboard
      - /docker/backtest
      - /docker/ml
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
