name: Build & Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker/**'
      - 'dashboard/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        id: version
        run: |
          TAG=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Version: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: hydra-engine
            dockerfile: docker/engine/Dockerfile
            context: .
          - image: hydra-dashboard
            dockerfile: docker/dashboard/Dockerfile
            context: .
          - image: hydra-backtest
            dockerfile: docker/backtest/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - uses: docker/setup-buildx-action@v4

      # version tags are releases and never move; a rebuild without a version bump only updates main and sha
      - name: Tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          release="$IMAGE:$VERSION"
          if docker buildx imagetools inspect "$release" >/dev/null 2>&1; then
            echo "::notice::$release already exists, bump the version in pyproject.toml to release"
            release=""
          fi
          printf 'list<<EOF\n%s:main\n%s:sha-%s\n%s\nEOF\n' "$IMAGE" "$IMAGE" "${GITHUB_SHA::7}" "$release" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
