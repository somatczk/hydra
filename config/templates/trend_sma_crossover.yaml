name: SMA Crossover Trend
strategy_class: hydra.strategy.builtin.rule_based.RuleBasedStrategy
enabled: false
symbols:
  - BTCUSDT
exchange:
  exchange_id: binance
  market_type: SPOT
timeframes:
  primary: 4h
parameters:
  description: Trend-following strategy using SMA 20/50 crossover. Enters on golden cross, exits on death cross.
  required_history: 60
  rules:
    entry_long:
      operator: AND
      conditions:
        - indicator: sma
          params: {period: 20}
          comparator: crosses_above
          value: "sma:period=50"
          value_ref_overrides: {slow_sma_period: period}
    exit_long:
      operator: AND
      conditions:
        - indicator: sma
          params: {period: 20}
          comparator: crosses_below
          value: "sma:period=50"
          value_ref_overrides: {slow_sma_period: period}
    entry_short: null
    exit_short: null
position_sizing:
  method: fixed_fractional
  risk_per_trade_pct: 1.5
  max_position_pct: 15.0
_template_meta:
  description: Classic SMA 20/50 golden/death cross on the 4h timeframe. sma_period sets the fast SMA, slow_sma_period the slow one.
  type: rule_based
  risk_level: moderate
  recommended_capital: 10000
