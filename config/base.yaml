# Defaults for every environment; override any key from env as HYDRA_<SECTION>__<KEY>.
# Infra is env-only: DATABASE_URL, REDIS_URL, HYDRA_CREDENTIAL_KEY, HYDRA_API_TOKEN.
platform:
  name: hydra

trading:
  testnet: true
  paper_trading: true
  default_symbols:
    - BTCUSDT

logging:
  level: INFO
  format: json

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  auth_mode: proxy
  trusted_proxy_cidrs: []

ml:
  models_dir: /app/models
  inference_timeout_ms: 5
