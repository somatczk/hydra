# Defaults for every environment; override any key from env as HYDRA_<SECTION>__<KEY>.
# Infra is env-only: DATABASE_URL, REDIS_URL, HYDRA_CREDENTIAL_KEY, HYDRA_API_TOKEN.
platform:
  name: hydra

trading:
  testnet: true
  paper_trading: true
  default_symbols:
    - BTCUSDT

logging:
  level: INFO
  format: json

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  auth_mode: proxy
  trusted_proxy_cidrs: []

ml:
  models_dir: /app/models
  inference_timeout_ms: 5

data:
  auto_fetch_enabled: true
  fetch_weight_per_min: 900
  fetch_patience_s: 900
  fetch_max_bars: 2000000
  cache_max_gb: 10.0
  sweep_interval_s: 3600
  row_bytes_estimate: 160
