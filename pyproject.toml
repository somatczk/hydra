[project]
name = "hydra"
version = "2.8.0"
description = "Bitcoin auto-trading platform"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "somatczk" }]

dependencies = [
    # Core
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.16.0,<3",
    "pyyaml>=6.0,<7",
    "structlog>=26.1.0,<27",
    "msgpack>=1.2.1,<2",
    "redis[hiredis]>=8.1.0,<9",
    # Data
    "ccxt>=4.4,<5",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    # Indicators
    "numpy>=2.1,<3",
    "pandas>=3.0.6,<4",
    "ta-lib>=0.5,<1; sys_platform != 'win32'",
    # ML
    "onnxruntime>=1.20,<2",
    # Backtest
    "optuna>=5.0.0,<6",
    # Execution
    "ccxt[async]>=4.5.88,<5",
    # Dashboard backend
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "websockets>=17.2,<18",
    # MCP server
    "mcp>=2.3,<3",
    # HTTP client
    "httpx>=0.28.1,<1",
    # Observability
    "prometheus-client>=0.21,<1",
    # Encryption
    "cryptography>=50.0.0,<51",
    # Security constraints for transitive deps
    "pyasn1>=0.6.4",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
ml-training = [
    "xgboost>=3.2,<4",
    "lightgbm>=4.5,<5",
    "scikit-learn>=1.6,<2",
    "onnxmltools>=1.12,<2",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.14,<4",
    "pytest-benchmark>=5.1,<6",
    "pytest-timeout>=2.3,<3",
    "aioresponses>=0.7,<1",
    "factory-boy>=3.3,<4",
    "faker>=40.43.0,<41",
    "testcontainers[postgres,redis]>=4.9,<5",
    "ruff>=0.15.7,<1",
    "mypy>=2.4.0,<3",
    "bandit>=1.8,<2",
    "import-linter>=2.1,<3",
    "types-pyyaml>=6.0.12.20260906",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydra"]

[tool.uv]
required-version = ">=0.12.18"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit test, no infrastructure",
    "integration: requires TimescaleDB + Redis (testcontainers)",
    "e2e: full pipeline test, all infrastructure",
    "performance: benchmark test, may be slow",
    "slow: long-running test",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",             # pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "N",             # pep8-naming
    "S",             # bandit
    "RUF",           # ruff-specific
]
ignore = ["S101", "S104", "S110"]  # allow assert in tests, binding to all interfaces, metrics try-except-pass

[tool.ruff.lint.isort]
known-first-party = ["hydra"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
    "src/hydra/strategy/indicator_registry.py",
]

[[tool.mypy.overrides]]
module = ["msgpack", "msgpack.*", "asyncpg", "asyncpg.*", "ccxt", "ccxt.*", "talib", "talib.*", "onnxruntime", "onnxruntime.*", "onnxmltools", "onnxmltools.*", "xgboost", "xgboost.*", "lightgbm", "lightgbm.*", "optuna", "optuna.*", "sklearn", "sklearn.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hydra.strategy.builtin.*", "hydra.strategy.rule_engine", "hydra.strategy.indicator_registry", "hydra.data.*", "hydra.backtest.*", "hydra.execution.*", "hydra.risk.*", "hydra.portfolio.*", "hydra.dashboard.*", "hydra.dashboard.routes.*"]
disallow_any_expr = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = false
disallow_any_generics = false

[tool.coverage.run]
source = ["src/hydra"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104", "B110", "B324", "B608"]

[tool.importlinter]
root_packages = ["hydra"]

[[tool.importlinter.contracts]]
name = "Module boundaries"
type = "layers"
layers = [
    # the trader is the split's composition root: the engine behind its own app
    "hydra.trader",
    "hydra.dashboard",
    "hydra.services",
    "hydra.portfolio | hydra.backtest",
    "hydra.execution",
    "hydra.risk | hydra.ml",
    "hydra.strategy",
    "hydra.data",
    "hydra.indicators",
    "hydra.core | hydra.ops",
]
