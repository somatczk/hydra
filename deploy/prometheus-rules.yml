groups:
  - name: hydra-trading
    interval: 30s
    rules:
      - alert: HydraDrawdownExceedsThreshold
        expr: hydra_drawdown_ratio > 0.10
        for: 1m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Hydra drawdown exceeds 10%"
          description: "Current drawdown is {{ $value | humanizePercentage }}. Circuit breakers should have been triggered."

      - alert: HydraExchangeWSDisconnected
        expr: increase(hydra_ws_reconnects_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Exchange WebSocket reconnecting too frequently"
          description: "Exchange {{ $labels.exchange_id }} has reconnected {{ $value | printf \"%.0f\" }} times in the last 5 minutes."

      - alert: HydraOrderFillLatencyHigh
        expr: histogram_quantile(0.99, rate(hydra_order_fill_latency_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Order fill latency p99 exceeds 5 seconds"
          description: "The 99th percentile order fill latency is {{ $value | printf \"%.2f\" }}s, indicating exchange slowness or connectivity issues."

      - alert: HydraFeedStale
        expr: time() - hydra_feed_last_message_timestamp_seconds > 120
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Market data feed stale"
          description: "No market data message for {{ $labels.exchange_id }}/{{ $labels.symbol }} {{ $labels.timeframe }} in {{ $value | printf \"%.0f\" }} seconds."

      - alert: HydraClosedBarOverdue
        expr: time() - hydra_feed_last_closed_bar_timestamp_seconds > 2 * hydra_feed_bar_interval_seconds + 60
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Closed bar overdue"
          description: "The last closed {{ $labels.timeframe }} bar for {{ $labels.exchange_id }}/{{ $labels.symbol }} opened {{ $value | printf \"%.0f\" }} seconds ago."

      - alert: HydraEngineDown
        expr: up{job="hydra"} == 0
        for: 2m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Hydra engine is down"
          description: "The Hydra trading engine has been unreachable for over 2 minutes. All trading activity is halted."

  - name: hydra-system
    interval: 30s
    rules:
      - alert: HydraEventBusLatencyHigh
        expr: histogram_quantile(0.99, rate(hydra_event_bus_latency_seconds_bucket[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Event bus latency p99 exceeds 500ms"
          description: "In-process event dispatch p99 is {{ $value | printf \"%.3f\" }}s; a subscriber callback is slow."

      - alert: HydraExchangeAPILatencyHigh
        expr: histogram_quantile(0.99, sum by (le, exchange_id, endpoint) (rate(hydra_exchange_api_latency_seconds_bucket[5m]))) > 5
        for: 2m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Exchange API latency p99 exceeds 5 seconds"
          description: "Exchange {{ $labels.exchange_id }} {{ $labels.endpoint }} p99 is {{ $value | printf \"%.2f\" }}s over all calls, failed and timed-out ones included."

      - alert: HydraExchangeAPIErrorRate
        expr: |
          (
            sum by (exchange_id, endpoint) (rate(hydra_exchange_api_errors_total[5m]))
            /
            sum by (exchange_id, endpoint) (rate(hydra_exchange_api_latency_seconds_count[5m]))
          ) > 0.2
          and
          sum by (exchange_id, endpoint) (increase(hydra_exchange_api_latency_seconds_count[5m])) >= 3
        for: 2m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Exchange API error rate above 20%"
          description: "Exchange {{ $labels.exchange_id }} {{ $labels.endpoint }}: {{ $value | humanizePercentage }} of calls failed or timed out over 5 minutes."

  - name: hydra-health
    interval: 30s
    rules:
      - alert: HydraNotReady
        expr: hydra_ready == 0
        for: 3m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Hydra readiness check failing"
          description: "Readiness check {{ $labels.check }} has failed for 3 minutes; GET /readyz names the cause."

      - alert: HydraSessionNotSupervised
        expr: hydra_session_desired == 1 unless on (session_id) hydra_session_supervised == 1
        for: 2m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Trading session running in the database but not in the engine"
          description: "Session {{ $labels.session_id }} is marked running but has no live task (zombie); it is not trading and will be resumed on restart."

      - alert: HydraHealthMonitorStalled
        expr: time() - hydra_health_monitor_last_run_timestamp_seconds > 60
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Hydra health monitor stalled"
          description: "The health monitor last ran {{ $value | printf \"%.0f\" }} seconds ago; readiness gauges are stale."

      - alert: HydraSessionErrored
        # the labelled counter is first scraped at 1, so its first error is the series appearing
        expr: |
          (hydra_sessions_errored_total unless hydra_sessions_errored_total offset 15m)
          or
          (increase(hydra_sessions_errored_total[15m]) > 0)
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Trading session moved to error"
          description: "{{ $value | printf \"%.0f\" }} session(s) of strategy {{ $labels.strategy_id }} errored in the last 15 minutes."

      - alert: HydraKillSwitchActive
        expr: hydra_kill_switch_active == 1
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Hydra kill switch is latched"
          description: "New entries are refused until the kill switch is released."

      - alert: HydraCircuitBreakerTripped
        expr: hydra_circuit_breaker_active_tier > 0
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Drawdown circuit breaker active"
          description: "Circuit breaker tier {{ $value | printf \"%.0f\" }} is active ({{ $labels.scope }})."

      - alert: HydraPaperPersistDirty
        expr: hydra_paper_persist_dirty == 1
        for: 5m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Paper fills not persisted"
          description: "Session {{ $labels.session_id }} has held unpersisted fills for 5 minutes; new entries are refused."
