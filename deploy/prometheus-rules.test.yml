            exp_annotations:
              summary: "ML model feature drift is high"
              description: "Model alpha's max feature PSI is 0.310 (alert threshold 0.2, retrain threshold 0.25). Retraining is manual by design: run the retrain from the Models page or POST /api/models/alpha/retrain and promote the challenger yourself — this alert never triggers it. Drift is measured at trader startup only, so the gauge refreshes on the next restart."

  - name: ml drift psi 0.19 does not fire
